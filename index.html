<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <title>PlayerVerify AI</title>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col">
        <!-- Header -->
        <div class="bg-slate-900 text-white p-6 rounded-b-3xl">
            <h1 class="text-xl font-bold">PlayerVerify <span class="text-emerald-400">AI</span></h1>
            <p class="text-xs text-slate-400">Identity & Age Verification Tool</p>
        </div>

        <!-- Main Content -->
        <div id="content" class="flex-1 p-6 space-y-6">
            <!-- Initial Entry -->
            <div id="step-start" class="text-center py-10">
                <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
                </div>
                <h2 class="text-2xl font-bold mb-4">Start Verification</h2>
                <button onclick="startVerification()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">Scan Aadhaar QR</button>
            </div>
        </div>
    </div>

    <script>
        // Data Store
        let playerData = { name: '', dob: '', address: '', selfieBlob: null, idBlob: null };

        // Core Functions
        function startVerification() {
            renderContent(`
                <div class="text-center">
                    <p class="mb-4 text-slate-600">Please point your camera at the Aadhaar QR code.</p>
                    <div id="scanner-ui" class="w-full h-64 bg-slate-200 rounded-xl flex items-center justify-center">Loading Camera...</div>
                    <button onclick="showManualUpload()" class="mt-6 w-full text-blue-600 font-bold underline">QR Failing? Manual Upload</button>
                </div>
            `);
            // Initialize camera logic here...
        }

        function showManualUpload() {
            renderContent(`
                <h2 class="text-xl font-bold mb-4">Upload Aadhaar</h2>
                <input type="file" id="front-id" class="hidden" onchange="handleFileUpload('front', event)">
                <button onclick="document.getElementById('front-id').click()" class="w-full p-4 border-2 border-dashed rounded-xl mb-4">Capture/Upload Front</button>
                <input type="file" id="back-id" class="hidden" onchange="handleFileUpload('back', event)">
                <button onclick="document.getElementById('back-id').click()" class="w-full p-4 border-2 border-dashed rounded-xl">Capture/Upload Back</button>
            `);
        }

        function handleFileUpload(side, event) {
            // Simulate OCR data extraction
            const file = event.target.files[0];
            if(file) {
                playerData.name = "Rahul Sharma"; // Mocked extraction
                playerData.dob = "2004-05-12";
                playerData.address = "Sector 14, Rohini, New Delhi";
                confirmDataGate();
            }
        }

        function confirmDataGate() {
            renderContent(`
                <h2 class="text-xl font-bold mb-4">Confirm Details</h2>
                <input type="text" value="${playerData.name}" class="w-full p-3 border rounded mb-2" id="edit-name">
                <input type="date" value="${playerData.dob}" class="w-full p-3 border rounded mb-2" id="edit-dob">
                <textarea class="w-full p-3 border rounded mb-4" id="edit-addr">${playerData.address}</textarea>
                <button onclick="goToSelfie()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold">Proceed to Selfie</button>
            `);
        }

        function goToSelfie() {
            renderContent(`
                <h2 class="text-xl font-bold mb-4">Take Live Selfie</h2>
                <div class="w-full h-64 bg-slate-900 rounded-2xl overflow-hidden mb-6"></div>
                <button onclick="processAI()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">Verify & Match</button>
            `);
        }

        function processAI() {
            renderContent(`<div class="text-center py-20 font-bold text-xl">Processing AI Match...</div>`);
            setTimeout(() => {
                const age = calculateAge(document.getElementById('edit-dob').value);
                renderContent(`
                    <h2 class="text-2xl font-bold text-emerald-600 mb-6 text-center">Verified!</h2>
                    <div class="bg-slate-100 p-6 rounded-2xl">
                        <p><strong>Name:</strong> ${document.getElementById('edit-name').value}</p>
                        <p><strong>Age:</strong> ${age.years} yrs, ${age.months} mos, ${age.days} days</p>
                        <p><strong>Address:</strong> ${document.getElementById('edit-addr').value}</p>
                    </div>
                    <button onclick="location.reload()" class="w-full mt-6 bg-slate-800 text-white py-4 rounded-xl font-bold">Scan Next Player</button>
                `);
            }, 2000);
        }

        function calculateAge(dob) {
            const birth = new Date(dob);
            const today = new Date();
            let years = today.getFullYear() - birth.getFullYear();
            let months = today.getMonth() - birth.getMonth();
            let days = today.getDate() - birth.getDate();
            if (days < 0) { months--; days += 30; }
            if (months < 0) { years--; months += 12; }
            return { years, months, days };
        }

        function renderContent(html) {
            document.getElementById('content').innerHTML = html;
        }
    </script>
</body>
</html>
